name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full requires-python range (>=3.9), matching pyproject.toml's
        # classifiers exactly -- a version claimed there but not tested
        # here would be an unverified compatibility claim.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core + dev only — no anthropic/openai extras)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check goldenboy tests scripts run_tests.py

      - name: Type check
        run: mypy

      - name: Test (with coverage, informational — no enforced threshold)
        run: pytest tests/ -v --cov=goldenboy --cov-report=term-missing

      - name: Test with anthropic/openai extras too
        if: matrix.python-version == '3.13'
        run: |
          pip install -e ".[dev,anthropic,openai]"
          mypy
          pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Verify the built wheel installs and runs cleanly
        run: |
          python -m venv /tmp/verify-install
          /tmp/verify-install/bin/pip install dist/*.whl
          /tmp/verify-install/bin/goldenboy --help
          /tmp/verify-install/bin/goldenboy status --budget 50
          /tmp/verify-install/bin/goldenboy status --budget 50 --json
          /tmp/verify-install/bin/goldenboy plan "Fix a typo in README" --budget 50
          /tmp/verify-install/bin/goldenboy analyze "Fix a typo in README" --budget 50
          /tmp/verify-install/bin/goldenboy analyze "Fix a typo in README" --budget 50 --json
          /tmp/verify-install/bin/goldenboy doctor
          /tmp/verify-install/bin/goldenboy doctor --json
          /tmp/verify-install/bin/goldenboy validate
          /tmp/verify-install/bin/goldenboy replay
          /tmp/verify-install/bin/goldenboy report --outcome completed --task-type bug_fix --estimated-cost-percentage 8.0 --actual-total-tokens 9000
          /tmp/verify-install/bin/goldenboy report --outcome completed --task-type bug_fix --estimated-cost-percentage 8.0 --actual-total-tokens 9000 --json
          /tmp/verify-install/bin/goldenboy calibrate
          /tmp/verify-install/bin/goldenboy calibrate --json
          /tmp/verify-install/bin/goldenboy export --output /tmp/verify-install-export.json

      - name: Benchmark sanity check (runs cleanly, latency is non-negative -- not a performance gate)
        run: |
          /tmp/verify-install/bin/goldenboy benchmark --json | python3 -c "
          import json, sys
          report = json.load(sys.stdin)
          assert report['estimator_determinism_pass'] is True, 'Estimator must be deterministic'
          for key in ('estimator_latency', 'risk_engine_latency'):
              sample = report[key]
              assert sample is not None, f'{key} did not run'
              assert sample['mean_ms'] >= 0.0, f'{key} produced a negative latency'
          print('benchmark sanity check passed:', json.dumps({k: report[k] for k in ('estimator_determinism_pass',)}))
          "

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install --upgrade pip
          pip install -e ".[anthropic,openai,tiktoken]" pip-audit
          pip-audit

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the real goldenboy CLI the SDK talks to (core only)
        run: pip install -e .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SDK devDependencies
        working-directory: sdk/typescript
        run: npm install

      - name: Type check
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

      - name: Test (real integration against the goldenboy CLI just installed -- no mocking)
        working-directory: sdk/typescript
        run: node --test dist/test
